<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para ti 🌻✨</title>

  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #facc15;
      --gold-light: #fef08a;
      --gold-dark: #ca8a04;
      --bg-dark: #030712;
      --glass-bg: rgba(15, 23, 42, 0.95);
      --glass-border: rgba(250, 204, 21, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
      pointer-events: none;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .viewport {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .title-banner {
      text-align: center;
      margin-bottom: 22px;
      animation: fadeInDown 0.8s ease;
    }

    .title-banner h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.6rem, 8vw, 3.8rem);
      color: var(--gold-primary);
      line-height: 1.1;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }

    .title-banner p {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 300;
      letter-spacing: 1px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .card-container {
      position: relative;
      width: 100%;
      max-width: 350px;
      height: 450px;
      border-radius: 28px;
      padding: 2px;
      background: linear-gradient(135deg, #fef08a, #ca8a04);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      will-change: transform;
    }

    .card-body {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 26px;
      overflow: hidden;
    }

    .card-secret {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 1;
    }

    .secret-icon {
      font-size: 3.2rem;
      margin-bottom: 12px;
      animation: floatHeart 3s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .secret-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: var(--gold-primary);
      margin-bottom: 8px;
    }

    .secret-msg {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .wax-seal-btn {
      background: linear-gradient(135deg, #fde047 0%, #ca8a04 100%);
      border: none;
      color: #3a1a04;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulseBtn 2s infinite;
    }

    @keyframes pulseBtn {
      0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(250, 204, 21, 0); }
      100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
    }

    .wax-seal-btn:active {
      transform: scale(0.95);
    }

    #scratch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    .music-player-card {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }

    .music-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold-primary);
    }

    .music-sub {
      font-size: 0.65rem;
      color: #94a3b8;
      display: block;
    }

    .visualizer-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }

    .bar {
      width: 3px;
      background: var(--gold-primary);
      border-radius: 2px;
      height: 4px;
    }

    .playing .bar:nth-child(1) { animation: soundBar 0.6s infinite alternate ease-in-out; }
    .playing .bar:nth-child(2) { animation: soundBar 0.8s infinite alternate ease-in-out 0.2s; }
    .playing .bar:nth-child(3) { animation: soundBar 0.5s infinite alternate ease-in-out 0.4s; }

    @keyframes soundBar {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.96);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    #modal-flower-box {
      position: absolute;
      inset: 0;
      z-index: 205;
      pointer-events: none;
      overflow: hidden;
    }

    .modal-floating-flower {
      position: absolute;
      pointer-events: none;
      animation: modalFloatSway 6s linear forwards;
      will-change: transform, opacity;
    }

    @keyframes modalFloatSway {
      0% {
        transform: translateY(105vh) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% {
        transform: translateY(-10vh) rotate(180deg);
        opacity: 0;
      }
    }

    .modal-box {
      position: relative;
      z-index: 210;
      background: #0f172a;
      border: 1px solid var(--glass-border);
      padding: 24px 20px;
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-backdrop.active .modal-box {
      transform: scale(1);
    }

    .polaroid-frame {
      background: #fff;
      padding: 8px 8px 20px 8px;
      border-radius: 8px;
      transform: rotate(-2deg);
      margin: 12px auto 18px auto;
      max-width: 180px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .polaroid-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
      background: #1e293b;
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      color: #334155;
      font-size: 1.2rem;
      margin-top: 4px;
      font-weight: 700;
    }

    .typewriter-text {
      font-family: 'Caveat', cursive;
      font-size: 1.45rem;
      color: #f1f5f9;
      line-height: 1.5;
      text-align: left;
    }

    .highlight-gold {
      color: var(--gold-primary);
      font-weight: 700;
    }

    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background-color: var(--gold-primary);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Audio MP3 Local -->
  <audio id="bg-music" src="cancion.mp3" preload="auto" loop></audio>

  <!-- Reproductor de Música UI -->
  <div id="music-player" class="music-player-card">
    <div class="visualizer-bars" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div>
      <span class="music-title">Flores Amarillas ✨</span>
      <span class="music-sub" id="music-status">Toca para reproducir</span>
    </div>
  </div>

  <canvas id="bg-canvas"></canvas>

  <div class="viewport">
    <div class="title-banner">
      <h1>¡Una Sorpresa Para Ti! ✨</h1>
      <p>Rasca la tarjeta dorada para descubrirla 🌻</p>
    </div>

    <div class="card-container" id="cardContainer">
      <div class="card-body">
        
        <div class="card-secret">
          <div class="secret-icon">🌻✨💛</div>
          <h2 class="secret-title">¡Feliz día de las flores amarillas!</h2>
          <p class="secret-msg">
            Un detalle único preparado especialmente para ti, porque iluminas todo a tu alrededor. ✨
          </p>
          <button id="btn-open-modal" class="wax-seal-btn">✉️ Abrir carta especial</button>
        </div>

        <canvas id="scratch-canvas"></canvas>

      </div>
    </div>
  </div>

  <div id="modal" class="modal-backdrop">
    <div id="modal-flower-box"></div>

    <div class="modal-box" id="modalBox">
      <h2 style="color: var(--gold-primary); font-family: 'Dancing Script', cursive; font-size: 2.3rem; margin-bottom: 8px; text-align: center;">Para ti 💛</h2>
      
      <div class="polaroid-frame">
        <img src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=400&auto=format&fit=crop" alt="Flores Amarillas" class="polaroid-img">
        <div class="polaroid-caption">Siempre brillas ✨</div>
      </div>

      <div class="typewriter-text">
        <span id="typewriter-content"></span><span id="typewriter-cursor" class="typewriter-cursor"></span>
      </div>

      <div style="text-align: center; margin-top: 24px; padding-bottom: 8px;">
        <button id="btn-close-modal" class="wax-seal-btn">✨ Toca para cerrar 🌻</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       1. AUDIO OPTIMIZADO Y DESBLOQUEADO
       ========================================== */
    let audioCtx = null;
    let lastAudioTime = 0;
    let bgMusicUnlocked = false;

    const bgMusic = document.getElementById('bg-music');
    const musicPlayer = document.getElementById('music-player');
    const musicStatus = document.getElementById('music-status');
    let isPlaying = false;

    // Función crucial: Desbloquea el reproductor en el primer toque del usuario
    function unlockMusicPermissions() {
      if (!bgMusicUnlocked) {
        bgMusic.play().then(() => {
          if (!isPlaying) {
            bgMusic.pause();
            bgMusic.currentTime = 0;
          }
          bgMusicUnlocked = true;
        }).catch(() => {});
      }
    }

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      unlockMusicPermissions();
    }

    function playScratchSound() {
      const now = Date.now();
      if (now - lastAudioTime < 70) return;
      lastAudioTime = now;

      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.03; 
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);

      noise.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playTypewriterKeySound() {
      const now = Date.now();
      if (now - lastAudioTime < 90) return;
      lastAudioTime = now;

      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.02);
    }

    function playPopSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    /* ==========================================
       2. CONTROL DE MÚSICA DE FONDO
       ========================================== */
    function startMusicAutomatically() {
      bgMusic.play().then(() => {
        isPlaying = true;
        musicPlayer.classList.add('playing');
        musicStatus.textContent = 'Sonando 🎵';
      }).catch((err) => {
        console.log("Incapaz de reproducir automáticamente:", err);
      });
    }

    function toggleMusicManual() {
      initAudioContext();
      if (isPlaying) {
        bgMusic.pause();
        isPlaying = false;
        musicPlayer.classList.remove('playing');
        musicStatus.textContent = 'Pausado';
      } else {
        startMusicAutomatically();
      }
    }

    musicPlayer.addEventListener('click', toggleMusicManual);

    /* ==========================================
       3. FONDO Y FUEGOS ARTIFICIALES
       ========================================== */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let stars = [];
    let particles = [];

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < 35; i++) {
        stars.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          size: Math.random() * 2 + 0.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function spawnFlowerFireworks(x, y, count = 25) {
      const floralEmojis = ['🌻', '🌼', '💛', '✨'];
      const posX = x || bgCanvas.width / 2;
      const posY = y || bgCanvas.height / 2;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: posX,
          y: posY,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          size: Math.random() * 18 + 16,
          emoji: floralEmojis[Math.floor(Math.random() * floralEmojis.length)],
          alpha: 1
        });
      }
    }

    function renderBg() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
        bgCtx.fillStyle = `rgba(250, 204, 21, ${s.alpha})`;
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        bgCtx.fill();
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.alpha -= 0.018;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          bgCtx.globalAlpha = p.alpha;
          bgCtx.font = `${p.size}px sans-serif`;
          bgCtx.fillText(p.emoji, p.x, p.y);
          bgCtx.globalAlpha = 1;
        }
      }

      requestAnimationFrame(renderBg);
    }

    window.addEventListener('resize', resizeBg);
    resizeBg();
    renderBg();

    /* ==========================================
       4. CANVAS RASPABLE CON DISPARADOR DE AUDIO
       ========================================== */
    const scratchCanvas = document.getElementById('scratch-canvas');
    const scratchCtx = scratchCanvas.getContext('2d');
    const cardContainer = document.getElementById('cardContainer');

    let isDrawing = false;
    let lastPos = null;
    let isRevealed = false;
    let scratchMoveCounter = 0;

    function initScratchCanvas() {
      const rect = cardContainer.getBoundingClientRect();
      scratchCanvas.width = rect.width;
      scratchCanvas.height = rect.height;

      scratchCtx.fillStyle = '#ca8a04';
      scratchCtx.fillRect(0, 0, rect.width, rect.height);

      scratchCtx.fillStyle = '#3a1a04';
      scratchCtx.font = 'bold 16px Poppins, sans-serif';
      scratchCtx.textAlign = 'center';
      scratchCtx.fillText('✨ Rasca aquí con tu dedo ✨', rect.width / 2, rect.height / 2);
    }

    window.addEventListener('load', initScratchCanvas);

    function getPos(e) {
      const rect = scratchCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function scratchLine(from, to) {
      if (isRevealed) return;

      scratchCtx.globalCompositeOperation = 'destination-out';
      scratchCtx.lineWidth = 50;
      scratchCtx.lineCap = 'round';

      scratchCtx.beginPath();
      scratchCtx.moveTo(from.x, from.y);
      scratchCtx.lineTo(to.x, to.y);
      scratchCtx.stroke();

      playScratchSound();

      scratchMoveCounter++;
      if (scratchMoveCounter % 8 === 0) {
        checkScratchProgress();
      }
    }

    function checkScratchProgress() {
      if (isRevealed) return;

      const imgData = scratchCtx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height);
      const pixels = imgData.data;
      let clearCount = 0;

      for (let i = 3; i < pixels.length; i += 60) {
        if (pixels[i] === 0) clearCount++;
      }

      // Al rascar más del 30%:
      if ((clearCount / (pixels.length / 60)) * 100 > 30) {
        isRevealed = true;
        scratchCanvas.style.opacity = '0';
        setTimeout(() => scratchCanvas.remove(), 600);
        
        // ¡INICIAR MÚSICA AUTOMÁTICAMENTE AQUÍ!
        startMusicAutomatically();

        spawnFlowerFireworks(window.innerWidth / 2, window.innerHeight / 2, 35);
      }
    }

    scratchCanvas.addEventListener('mousedown', (e) => {
      initAudioContext();
      isDrawing = true;
      lastPos = getPos(e);
      scratchLine(lastPos, lastPos);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const currentPos = getPos(e);
      scratchLine(lastPos, currentPos);
      lastPos = currentPos;
    });

    window.addEventListener('mouseup', () => isDrawing = false);

    scratchCanvas.addEventListener('touchstart', (e) => {
      initAudioContext();
      isDrawing = true;
      lastPos = getPos(e);
      scratchLine(lastPos, lastPos);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      const currentPos = getPos(e);
      scratchLine(lastPos, currentPos);
      lastPos = currentPos;
    }, { passive: false });

    window.addEventListener('touchend', () => isDrawing = false);

    /* ==========================================
       5. MÁQUINA DE ESCRIBIR Y CARTA
       ========================================== */
    const btnOpenModal = document.getElementById('btn-open-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const modal = document.getElementById('modal');
    const modalBox = document.getElementById('modalBox');
    const modalFlowerBox = document.getElementById('modal-flower-box');
    const typewriterContent = document.getElementById('typewriter-content');
    const typewriterCursor = document.getElementById('typewriter-cursor');

    let modalFlowerInterval = null;
    let typewriterTimeout = null;

    const letterSegments = [
      { text: "Hay personas que traen ", gold: false },
      { text: "luz", gold: true },
      { text: " sin darse cuenta, y tú eres una de ellas. Sé que el camino no siempre ha sido fácil, que has llevado cargas pesadas y que a veces los pensamientos pesan más de la cuenta. Pero tu valentía para seguir sonriendo habla del hermoso corazón que tienes.\n\n", gold: false },
      { text: "No necesitas demostrar nada ni ser perfecta; tus días grises también merecen ", gold: false },
      { text: "paciencia, respeto y abrazos", gold: true },
      { text: ". Estas flores amarillas no son solo un detalle, son un recordatorio de que mereces momentos bonitos, ", gold: false },
      { text: "paz y un cariño sincero", gold: true },
      { text: " que jamás duela.\n\n", gold: false },
      { text: "Me alegra mucho coincidir contigo y estar conociéndote. ", gold: false },
      { text: "Gracias por dejarme descubrir la increíble persona que eres.", gold: true },
      { text: " 🌻✨", gold: false }
    ];

    function startOrganicTypewriter(segments) {
      typewriterContent.innerHTML = '';
      typewriterCursor.style.display = 'inline-block';
      modalBox.scrollTop = 0;
      
      let segIdx = 0;
      let charIdx = 0;
      let currentSpan = null;

      function typeChar() {
        if (segIdx >= segments.length) {
          typewriterCursor.style.display = 'none';
          return;
        }

        const segment = segments[segIdx];

        if (charIdx === 0) {
          currentSpan = document.createElement('span');
          if (segment.gold) currentSpan.className = 'highlight-gold';
          typewriterContent.appendChild(currentSpan);
        }

        const char = segment.text.charAt(charIdx);

        if (char === '\n') {
          currentSpan.appendChild(document.createElement('br'));
        } else {
          currentSpan.appendChild(document.createTextNode(char));
          playTypewriterKeySound();
        }

        modalBox.scrollTop = modalBox.scrollHeight;
        charIdx++;

        let delay = 28;
        if (char === '.' || char === '\n') delay = 350;

        if (charIdx < segment.text.length) {
          typewriterTimeout = setTimeout(typeChar, delay);
        } else {
          segIdx++;
          charIdx = 0;
          typewriterTimeout = setTimeout(typeChar, delay);
        }
      }

      typeChar();
    }

    function spawnModalFlower() {
      if (modalFlowerBox.children.length >= 6) return;

      const flower = document.createElement('div');
      flower.className = 'modal-floating-flower';
      flower.textContent = ['🌻', '🌼', '💛'][Math.floor(Math.random() * 3)];
      flower.style.left = Math.random() * 90 + 'vw';
      flower.style.fontSize = (Math.random() * 10 + 20) + 'px';

      modalFlowerBox.appendChild(flower);
      setTimeout(() => flower.remove(), 6000);
    }

    btnOpenModal.addEventListener('click', (e) => {
      initAudioContext();
      if (!isPlaying) startMusicAutomatically();

      const rect = e.target.getBoundingClientRect();
      spawnFlowerFireworks(rect.left + rect.width / 2, rect.top + rect.height / 2, 20);

      modal.classList.add('active');
      modalFlowerInterval = setInterval(spawnModalFlower, 800);
      clearTimeout(typewriterTimeout);
      startOrganicTypewriter(letterSegments);
    });

    btnCloseModal.addEventListener('click', () => {
      playPopSound();

      modal.classList.remove('active');
      clearInterval(modalFlowerInterval);
      clearTimeout(typewriterTimeout);
      modalFlowerBox.innerHTML = '';

      const w = window.innerWidth;
      const h = window.innerHeight;

      spawnFlowerFireworks(w * 0.5, h * 0.4, 30);
      setTimeout(() => spawnFlowerFireworks(w * 0.25, h * 0.5, 20), 120);
      setTimeout(() => spawnFlowerFireworks(w * 0.75, h * 0.5, 20), 240);
    });
  </script>
</body>
</html>
