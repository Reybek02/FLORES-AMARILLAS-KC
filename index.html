<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para ti 🌻✨</title>

  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #facc15;
      --gold-light: #fef08a;
      --gold-dark: #ca8a04;
      --bg-dark: #030712;
      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(250, 204, 21, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(234, 179, 8, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(250, 204, 21, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 1) 0%, #030712 100%);
      pointer-events: none;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .viewport {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      perspective: 1200px;
    }

    .title-banner {
      text-align: center;
      margin-bottom: 22px;
      animation: fadeInDown 1.2s ease;
    }

    .title-banner h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.6rem, 8vw, 3.8rem);
      background: linear-gradient(135deg, #fff 20%, var(--gold-primary) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.4));
      line-height: 1.1;
    }

    .title-banner p {
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 300;
      letter-spacing: 1px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .card-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 460px;
      border-radius: 30px;
      padding: 2.5px;
      background: linear-gradient(135deg, #fef08a, #eab308, #854d0e, #fde047);
      background-size: 300% 300%;
      animation: goldGlow 6s ease infinite, fadeInUp 1.2s ease;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.95), 0 0 40px rgba(234, 179, 8, 0.25);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    @keyframes goldGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card-body {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 28px;
      overflow: hidden;
    }

    .card-secret {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 22px;
      text-align: center;
      z-index: 1;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    .secret-icon {
      font-size: 3.5rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.7));
      animation: bounceSoft 2.5s infinite ease-in-out;
    }

    @keyframes bounceSoft {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.08); }
    }

    .secret-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.3rem;
      color: var(--gold-primary);
      margin-bottom: 8px;
    }

    .secret-msg {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .wax-seal-btn {
      position: relative;
      background: linear-gradient(135deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
      border: 1px solid #fef08a;
      color: #3a1a04;
      padding: 13px 30px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(234, 179, 8, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.8);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .wax-seal-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px rgba(234, 179, 8, 0.5);
    }

    .wax-seal-btn:active {
      transform: scale(0.95);
    }

    #scratch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    .music-player-card {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .music-player-card:hover {
      border-color: var(--gold-primary);
      transform: scale(1.03);
    }

    .music-info {
      display: flex;
      flex-direction: column;
    }

    .music-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold-primary);
    }

    .music-sub {
      font-size: 0.65rem;
      color: #94a3b8;
    }

    .visualizer-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .bar {
      width: 3px;
      background: var(--gold-primary);
      border-radius: 3px;
      height: 4px;
      transition: height 0.2s ease;
    }

    .playing .bar:nth-child(1) { animation: soundBar 0.6s infinite alternate ease-in-out; }
    .playing .bar:nth-child(2) { animation: soundBar 0.8s infinite alternate ease-in-out 0.2s; }
    .playing .bar:nth-child(3) { animation: soundBar 0.5s infinite alternate ease-in-out 0.4s; }

    @keyframes soundBar {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    #modal-flower-box {
      position: absolute;
      inset: 0;
      z-index: 205;
      pointer-events: none;
      overflow: hidden;
    }

    .modal-floating-flower {
      position: absolute;
      pointer-events: none;
      animation: modalFloatSway 7s ease-in-out forwards;
    }

    .depth-far { filter: blur(3px); opacity: 0.5; }
    .depth-mid { filter: blur(0px); opacity: 0.9; }
    .depth-close { filter: blur(2px); opacity: 0.8; z-index: 215; }

    @keyframes modalFloatSway {
      0% {
        transform: translateY(105vh) translateX(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      50% { transform: translateY(50vh) translateX(35px) rotate(180deg) scale(1.1); }
      85% { opacity: 0.9; }
      100% {
        transform: translateY(-15vh) translateX(-25px) rotate(360deg) scale(1.3);
        opacity: 0;
      }
    }

    .modal-box {
      position: relative;
      z-index: 210;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--glass-border);
      padding: 32px 26px;
      border-radius: 32px;
      max-width: 440px;
      width: 100%;
      max-height: 84vh;
      overflow-y: auto;
      box-shadow: 0 30px 70px rgba(0,0,0,0.95), 0 0 40px rgba(250, 204, 21, 0.2);
      transform: scale(0.85) translateY(20px);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .modal-box {
      transform: scale(1) translateY(0);
    }

    .polaroid-frame {
      background: #fff;
      padding: 10px 10px 25px 10px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(250, 204, 21, 0.25);
      transform: rotate(-2deg);
      margin: 15px auto 22px auto;
      max-width: 200px;
      text-align: center;
      transition: transform 0.4s ease;
      animation: polaroidEntrance 0.8s ease forwards;
    }

    @keyframes polaroidEntrance {
      from { opacity: 0; transform: rotate(-8deg) scale(0.8); }
      to { opacity: 1; transform: rotate(-2deg) scale(1); }
    }

    .polaroid-frame:hover {
      transform: rotate(0deg) scale(1.05);
    }

    .polaroid-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      background: #1e293b;
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      color: #334155;
      font-size: 1.25rem;
      margin-top: 6px;
      font-weight: 700;
    }

    .typewriter-text {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: #f1f5f9;
      line-height: 1.6;
      text-align: left;
      min-height: 120px;
    }

    .highlight-gold {
      color: var(--gold-primary);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }

    .typewriter-cursor {
      display: inline-block;
      width: 3px;
      height: 1.3em;
      background-color: var(--gold-primary);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
      box-shadow: 0 0 8px var(--gold-primary);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Audio MP3 Local (Sin Anuncios) -->
  <audio id="bg-music" src="cancion.mp3" preload="auto" loop></audio>

  <!-- Reproductor de Música UI -->
  <div id="music-player" class="music-player-card">
    <div class="visualizer-bars" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="music-info">
      <span class="music-title">Flores Amarillas ✨</span>
      <span class="music-sub" id="music-status">Toca para reproducir</span>
    </div>
  </div>

  <canvas id="bg-canvas"></canvas>

  <div class="viewport">
    <div class="title-banner">
      <h1>¡Una Sorpresa Para Ti! ✨</h1>
      <p>Rasca la tarjeta dorada para descubrirla 🌻</p>
    </div>

    <div class="card-container" id="cardContainer">
      <div class="card-body">
        
        <div class="card-secret">
          <div class="secret-icon">🌻✨💛</div>
          <h2 class="secret-title">¡Feliz día de las flores amarillas!</h2>
          <p class="secret-msg">
            Un detalle único preparado especialmente para ti, porque iluminas todo a tu alrededor. ✨
          </p>
          <button id="btn-open-modal" class="wax-seal-btn">✉️ Abrir carta especial</button>
        </div>

        <canvas id="scratch-canvas"></canvas>

      </div>
    </div>
  </div>

  <div id="modal" class="modal-backdrop">
    <div id="modal-flower-box"></div>

    <div class="modal-box">
      <h2 style="color: var(--gold-primary); font-family: 'Dancing Script', cursive; font-size: 2.5rem; margin-bottom: 10px; text-align: center;">Para ti 💛</h2>
      
      <div class="polaroid-frame">
        <img src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=600&auto=format&fit=crop" alt="Flores Amarillas" class="polaroid-img">
        <div class="polaroid-caption">Siempre brillas ✨</div>
      </div>

      <div class="typewriter-text">
        <span id="typewriter-content"></span><span id="typewriter-cursor" class="typewriter-cursor"></span>
      </div>

      <div style="text-align: center; margin-top: 26px;">
        <button id="btn-close-modal" class="wax-seal-btn" style="padding: 10px 26px; font-size: 0.9rem;">Cerrar carta</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       1. EFECTOS DE SONIDO Y AUDIOCONTEXT
       ========================================== */
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function triggerVibration(pattern) {
      if ('vibrate' in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function playScratchSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.04; 
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1300;

      const gain = audioCtx.createGain();
      gain.gain.value = 0.04;

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playTypewriterKeySound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320 + Math.random() * 120, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function playSealSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
      
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playPopSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);
      
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playFanfareSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.6);
      });
    }

    /* ==========================================
       2. REPRODUCTOR DE MÚSICA LOCAL MP3
       ========================================== */
    const bgMusic = document.getElementById('bg-music');
    const musicPlayer = document.getElementById('music-player');
    const musicStatus = document.getElementById('music-status');
    let isPlaying = false;
    let audioUnlocked = false;

    function unlockMobileAudio() {
      if (audioUnlocked) return;
      initAudioContext();
      bgMusic.play().then(() => {
        if (!isPlaying) {
          bgMusic.pause();
          bgMusic.currentTime = 0;
        }
        audioUnlocked = true;
      }).catch(() => {});
    }

    window.addEventListener('touchstart', unlockMobileAudio, { once: true });
    window.addEventListener('mousedown', unlockMobileAudio, { once: true });

    function toggleMusic(play) {
      if (play) {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicPlayer.classList.add('playing');
          musicStatus.textContent = 'Sonando ahora 🎵';
        }).catch(err => {
          console.log("Autoplay bloqueado:", err);
        });
      } else {
        bgMusic.pause();
        isPlaying = false;
        musicPlayer.classList.remove('playing');
        musicStatus.textContent = 'Pausado';
      }
    }

    musicPlayer.addEventListener('click', () => {
      initAudioContext();
      toggleMusic(!isPlaying);
    });

    /* ==========================================
       3. MOTOR GRÁFICO (CON SOPORTE HIGH-DPI)
       ========================================== */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let stars = [];
    let particles = [];
    let touchTrail = [];

    function resizeBg() {
      const dpr = window.devicePixelRatio || 1;
      bgCanvas.width = window.innerWidth * dpr;
      bgCanvas.height = window.innerHeight * dpr;
      bgCtx.scale(dpr, dpr);
      initStars();
    }

    function initStars() {
      stars = [];
      const width = window.innerWidth;
      const height = window.innerHeight;
      for (let i = 0; i < 90; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2.2 + 0.8,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function spawnFireworks(originX, originY) {
      const emojis = ['🌻', '✨', '💛', '🌟', '🌸'];
      const x = originX || window.innerWidth / 2;
      const y = originY || window.innerHeight / 2;

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          size: Math.random() * 18 + 14,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          alpha: 1,
          decay: Math.random() * 0.018 + 0.008
        });
      }
    }

    function addTrailPoint(x, y) {
      touchTrail.push({ x, y, alpha: 1, size: Math.random() * 8 + 4 });
    }

    function renderBg() {
      bgCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
        bgCtx.fillStyle = `rgba(250, 204, 21, ${s.alpha * 0.8})`;
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        bgCtx.fill();
      });

      touchTrail.forEach((t, idx) => {
        t.alpha -= 0.035;
        if (t.alpha <= 0) {
          touchTrail.splice(idx, 1);
        } else {
          bgCtx.fillStyle = `rgba(250, 204, 21, ${t.alpha})`;
          bgCtx.beginPath();
          bgCtx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
          bgCtx.fill();
        }
      });

      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(idx, 1);
        } else {
          bgCtx.globalAlpha = p.alpha;
          bgCtx.font = `${p.size}px Poppins`;
          bgCtx.fillText(p.emoji, p.x, p.y);
          bgCtx.globalAlpha = 1;
        }
      });

      requestAnimationFrame(renderBg);
    }

    window.addEventListener('resize', resizeBg);
    resizeBg();
    renderBg();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName !== 'BUTTON' && e.target.id !== 'scratch-canvas') {
        spawnFireworks(e.clientX, e.clientY);
        playPopSound();
      }
    });

    /* ==========================================
       4. CANVAS RASPABLE CON RESOLUCIÓN RETINA/OLED
       ========================================== */
    const scratchCanvas = document.getElementById('scratch-canvas');
    const scratchCtx = scratchCanvas.getContext('2d');
    const cardContainer = document.getElementById('cardContainer');

    let isDrawing = false;
    let lastPos = null;
    let isRevealed = false;

    function initScratchCanvas() {
      const rect = cardContainer.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      scratchCanvas.width = rect.width * dpr;
      scratchCanvas.height = rect.height * dpr;
      scratchCtx.scale(dpr, dpr);

      const grad = scratchCtx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0, '#fef08a');
      grad.addColorStop(0.2, '#eab308');
      grad.addColorStop(0.5, '#fde047');
      grad.addColorStop(0.8, '#ca8a04');
      grad.addColorStop(1, '#854d0e');

      scratchCtx.fillStyle = grad;
      scratchCtx.fillRect(0, 0, rect.width, rect.height);

      scratchCtx.fillStyle = '#3a1a04';
      scratchCtx.font = 'bold 17px Poppins, sans-serif';
      scratchCtx.textAlign = 'center';
      scratchCtx.fillText('✨ Rasca aquí con tu dedo ✨', rect.width / 2, rect.height / 2 - 12);
      
      scratchCtx.font = '32px Poppins, sans-serif';
      scratchCtx.fillText('🎁', rect.width / 2, rect.height / 2 + 34);
    }

    window.addEventListener('load', initScratchCanvas);

    function getPos(e) {
      const rect = scratchCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top, absX: clientX, absY: clientY };
    }

    function scratchLine(from, to) {
      if (isRevealed) return;

      scratchCtx.globalCompositeOperation = 'destination-out';
      scratchCtx.lineWidth = 55;
      scratchCtx.lineCap = 'round';
      scratchCtx.lineJoin = 'round';

      scratchCtx.beginPath();
      scratchCtx.moveTo(from.x, from.y);
      scratchCtx.lineTo(to.x, to.y);
      scratchCtx.stroke();

      playScratchSound();
      triggerVibration(12);

      checkScratchProgress();
    }

    function checkScratchProgress() {
      if (isRevealed) return;

      const imgData = scratchCtx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height);
      const pixels = imgData.data;
      let clearCount = 0;

      for (let i = 3; i < pixels.length; i += 40) {
        if (pixels[i] === 0) clearCount++;
      }

      const percentage = (clearCount / (pixels.length / 40)) * 100;

      if (percentage > 40) {
        isRevealed = true;
        scratchCanvas.style.opacity = '0';
        setTimeout(() => scratchCanvas.remove(), 800);
        
        playFanfareSound();
        toggleMusic(true);
        triggerVibration([80, 40, 80, 40, 150]);
        spawnFireworks();
      }
    }

    function handleStart(e) {
      initAudioContext();
      isDrawing = true;
      lastPos = getPos(e);
      scratchLine(lastPos, lastPos);
      addTrailPoint(lastPos.absX, lastPos.absY);
    }

    function handleMove(e) {
      if (!isDrawing) return;
      const currentPos = getPos(e);
      scratchLine(lastPos, currentPos);
      addTrailPoint(currentPos.absX, currentPos.absY);
      lastPos = currentPos;

      const rect = cardContainer.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const tiltX = (currentPos.absY - centerY) / 18;
      const tiltY = (centerX - currentPos.absX) / 18;
      cardContainer.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    }

    function handleEnd() {
      isDrawing = false;
      cardContainer.style.transform = `rotateX(0deg) rotateY(0deg)`;
    }

    scratchCanvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    scratchCanvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchmove', (e) => { handleMove(e); }, { passive: false });
    window.addEventListener('touchend', handleEnd);

    /* ==========================================
       5. MÁQUINA DE ESCRIBIR ORGÁNICA
       ========================================== */
    const btnOpenModal = document.getElementById('btn-open-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const modal = document.getElementById('modal');
    const modalFlowerBox = document.getElementById('modal-flower-box');
    const typewriterContent = document.getElementById('typewriter-content');
    const typewriterCursor = document.getElementById('typewriter-cursor');

    let modalFlowerInterval = null;
    let typewriterTimeout = null;

    const letterSegments = [
      { text: "Hay personas que traen ", gold: false },
      { text: "luz", gold: true },
      { text: " sin darse cuenta, y tú eres una de ellas. Sé que el camino no siempre ha sido fácil, que has llevado cargas pesadas y que a veces los pensamientos pesan más de la cuenta. Pero tu valentía para seguir sonriendo habla del hermoso corazón que tienes.\n\n", gold: false },
      { text: "No necesitas demostrar nada ni ser perfecta; tus días grises también merecen ", gold: false },
      { text: "paciencia, respeto y abrazos", gold: true },
      { text: ". Estas flores amarillas no son solo un detalle, son un recordatorio de que mereces momentos bonitos, ", gold: false },
      { text: "paz y un cariño sincero", gold: true },
      { text: " que jamás duela.\n\n", gold: false },
      { text: "Me alegra mucho coincidir contigo y estar conociéndote. ", gold: false },
      { text: "Gracias por dejarme descubrir la increíble persona que eres.", gold: true },
      { text: " 🌻✨", gold: false }
    ];

    function startOrganicTypewriter(segments) {
      typewriterContent.innerHTML = '';
      typewriterCursor.style.display = 'inline-block';
      
      let segIdx = 0;
      let charIdx = 0;
      let currentSpan = null;

      function typeChar() {
        if (segIdx >= segments.length) {
          return;
        }

        const segment = segments[segIdx];

        if (charIdx === 0) {
          currentSpan = document.createElement('span');
          if (segment.gold) {
            currentSpan.className = 'highlight-gold';
          }
          typewriterContent.appendChild(currentSpan);
        }

        const char = segment.text.charAt(charIdx);

        if (char === '\n') {
          currentSpan.appendChild(document.createElement('br'));
        } else {
          currentSpan.appendChild(document.createTextNode(char));
          playTypewriterKeySound();
        }

        charIdx++;

        let delay = 26 + Math.random() * 20;

        if (char === ',') delay = 220;
        else if (char === '.') delay = 450;
        else if (char === '\n') delay = 500;

        if (charIdx < segment.text.length) {
          typewriterTimeout = setTimeout(typeChar, delay);
        } else {
          segIdx++;
          charIdx = 0;
          typewriterTimeout = setTimeout(typeChar, delay);
        }
      }

      typeChar();
    }

    function spawnModalFlower() {
      const flower = document.createElement('div');
      const depths = ['depth-far', 'depth-mid', 'depth-close'];
      const chosenDepth = depths[Math.floor(Math.random() * depths.length)];
      flower.className = `modal-floating-flower ${chosenDepth}`;
      
      const floralSymbols = ['🌻', '🌼', '🌸', '✨', '🌻', '💛'];
      flower.textContent = floralSymbols[Math.floor(Math.random() * floralSymbols.length)];
      
      flower.style.left = Math.random() * 92 + 'vw';
      flower.style.fontSize = (Math.random() * 18 + 22) + 'px';

      modalFlowerBox.appendChild(flower);
      setTimeout(() => flower.remove(), 7000);
    }

    btnOpenModal.addEventListener('click', () => {
      playSealSound();
      triggerVibration(40);
      modal.classList.add('active');
      
      spawnModalFlower();
      modalFlowerInterval = setInterval(spawnModalFlower, 400);

      clearTimeout(typewriterTimeout);
      startOrganicTypewriter(letterSegments);
    });

    btnCloseModal.addEventListener('click', () => {
      modal.classList.remove('active');
      clearInterval(modalFlowerInterval);
      clearTimeout(typewriterTimeout);
      modalFlowerBox.innerHTML = '';
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
        clearInterval(modalFlowerInterval);
        clearTimeout(typewriterTimeout);
        modalFlowerBox.innerHTML = '';
      }
    });
  </script>
</body>
</html>
